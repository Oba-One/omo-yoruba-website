<script type="text/x-dc" data-dc-script data-props="{&quot;start&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;odunde&quot;,&quot;gala&quot;,&quot;programs&quot;,&quot;lessons&quot;,&quot;collective&quot;,&quot;involved&quot;,&quot;impact&quot;,&quot;people&quot;,&quot;donate&quot;,&quot;gallery&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;pageTransition&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Cross-fade&quot;,&quot;options&quot;:[&quot;Cross-fade&quot;,&quot;None&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;transitionMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:380,&quot;min&quot;:200,&quot;max&quot;:700,&quot;step&quot;:20,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Navigation&quot;}}">
const PAGES = {"02 Homepage.dc.html":"home","08 Odunde Festival.dc.html":"odunde","09 End-of-Year Gala.dc.html":"gala","10 Programs.dc.html":"programs","11 Yoruba Language School.dc.html":"lessons","12 Yoruba Cultural Collective.dc.html":"collective","13 Get Involved.dc.html":"involved","14 Impact.dc.html":"impact","15 People and History.dc.html":"people","16 Donate.dc.html":"donate","18 Photo Gallery.dc.html":"gallery"};
const ROUTES = ["home","odunde","gala","programs","lessons","collective","involved","impact","people","donate","gallery"];
class Component extends DCLogic {
  constructor(props){
    super(props);
    const h = window.location.hash || '';
    const r = h.startsWith('#/') ? h.slice(2).split('#')[0] : '';
    this.state = { route: ROUTES.includes(r) ? r : (props.start || 'home'), anchor: h.startsWith('#/') && h.includes('#', 2) ? h.slice(h.indexOf('#', 2) + 1) : '' };
    this.onHash = this.onHash.bind(this); this.onClick = this.onClick.bind(this); this.pageRef = React.createRef(); this.barRef = React.createRef();
  }
  // Cross-fade: freeze a clone of the outgoing page over the viewport, mount the new page
  // underneath it, then dissolve the clone once the new page has painted. Nothing ever
  // shows a bare background, so there is no flash and no scroll jump.
  startNav(route, anchor){
    const src = this.pageRef.current;
    const off = (this.props.pageTransition || 'Cross-fade') === 'None';
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!src || off || reduce){ this.commit(route, anchor); this.enter(); return; }
    const dur = Math.max(140, Math.round(this.props.transitionMs || 380));
    const y = window.pageYOffset;
    this.dropVeils();
    // No transform anywhere on the veil: fixed children of the clone then still resolve
    // against the viewport, so a sticky nav holds its place in the frozen snapshot.
    const layer = document.createElement('div');
    layer.setAttribute('aria-hidden', 'true');
    layer.setAttribute('data-oy-veil', '');
    layer.style.cssText = 'position:fixed;inset:0;z-index:9000;overflow:hidden;background:var(--white);pointer-events:none;opacity:1;will-change:opacity;transition:opacity ' + dur + 'ms cubic-bezier(.33,0,.2,1)';
    const inner = document.createElement('div');
    inner.style.cssText = 'position:absolute;left:0;top:' + (-y) + 'px;width:' + src.offsetWidth + 'px';
    const clone = src.cloneNode(true);
    const sel = '.sc-host,.oy-nav,header,nav';
    const a = src.querySelectorAll(sel), b = clone.querySelectorAll(sel);
    for (let i = 0; i < a.length && i < b.length; i++){
      const p = getComputedStyle(a[i]).position;
      if (p !== 'sticky' && p !== 'fixed') continue;
      const r = a[i].getBoundingClientRect();
      b[i].style.position = 'fixed'; b[i].style.top = r.top + 'px'; b[i].style.left = r.left + 'px'; b[i].style.width = r.width + 'px'; b[i].style.margin = '0';
    }
    inner.appendChild(clone); layer.appendChild(inner); document.body.appendChild(layer);
    this.layer = layer;
    const reveal = () => {
      if (layer.dataset.done) return;
      layer.dataset.done = '1';
      clearTimeout(this.slowTimer); clearTimeout(this.capTimer);
      this.progress(false);
      layer.style.opacity = '0';
      setTimeout(() => { layer.remove(); if (this.layer === layer) this.layer = null; }, dur + 80);
    };
    this.capTimer = setTimeout(reveal, 1200);
    this.slowTimer = setTimeout(() => { if (!layer.dataset.done) this.progress(true); }, 220);
    this.commit(route, anchor);
    this.awaitPaint(reveal);
  }
  dropVeils(){ document.querySelectorAll('[data-oy-veil]').forEach(n => n.remove()); this.layer = null; }
  commit(route, anchor){ this.setState({ route, anchor }, () => { if (!anchor) window.scrollTo(0, 0); this.scrollToAnchor(); }); }
  progress(on){
    const el = this.barRef.current; if (!el) return;
    if (on){ el.style.opacity = '1'; el.style.width = '64%'; return; }
    if (el.style.opacity !== '1'){ el.style.width = '0'; return; }
    el.style.width = '100%'; el.style.opacity = '0';
    setTimeout(() => { el.style.transition = 'none'; el.style.width = '0'; requestAnimationFrame(() => { el.style.transition = 'width .5s ease,opacity .2s ease'; }); }, 280);
  }
  // Hold the veil until the incoming page has its nav and its first-screen photos decoded.
  awaitPaint(done){
    const t0 = Date.now();
    const step = () => {
      const el = this.pageRef.current, t = Date.now() - t0;
      if (t > 1100) return done();
      if (el && el.querySelector('.oy-nav')){
        const h = window.innerHeight + 120; let pending = false;
        el.querySelectorAll('img').forEach(im => {
          if (pending || im.complete) return;
          const r = im.getBoundingClientRect();
          if (r.top < h && r.bottom > -60) pending = true;
        });
        if (!pending && t > 110) return done();
      }
      setTimeout(step, 50);
    };
    setTimeout(step, 60);
  }
  enter(){ const el = this.pageRef.current; if (!el) return; el.classList.remove('site-enter'); void el.offsetWidth; el.classList.add('site-enter'); }
  resId(p){ return p.replace(/[^a-zA-Z0-9]/g, '_'); }
  swap(el){
    const R = window.__resources; if (!R) return;
    const fix = (node) => {
