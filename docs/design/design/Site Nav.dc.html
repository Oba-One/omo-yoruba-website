<dc-import name="Give Dialog" hint-size="100%,0"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:72},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;odunde&quot;,&quot;gala&quot;,&quot;programs&quot;,&quot;school&quot;,&quot;collective&quot;,&quot;involved&quot;,&quot;impact&quot;,&quot;news&quot;,&quot;gallery&quot;,&quot;about&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { menuOpen:false }; }
  renderVals(){
    return {
      current: this.props.current || '',
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen:false }),
      give: (e) => { window.dispatchEvent(new CustomEvent('oy:give', { detail:{ trigger: e.currentTarget } })); },
      giveFromMenu: (e) => { this.setState({ menuOpen:false }); window.dispatchEvent(new CustomEvent('oy:give', { detail:{ trigger:null } })); },
    };
  }
}
</script>
