name: Setup JavaScript toolchain
description: Node from .node-version, Bun from packageManager, then a frozen install

runs:
  using: composite
  steps:
    - name: Node (Astro, Vitest and the Vercel build run on it)
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version

    - name: Bun (install and scripts)
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Cache Bun downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # --ignore-scripts skips the root prepare script (lefthook install), which has no
    # place on a runner. Dependencies with install scripts are not trusted by Bun anyway.
    - name: Install from the frozen lockfile
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
