# Lighthouse CI against each Vercel preview, one job per preset, with the budgets of
# docs/design/QUALITY.md section 3 (packages/web/lighthouserc.cjs). Facts and sources:
# docs/research/phase-4-lighthouse-ci.md. Vercel sends a deployment_status event when a
# deployment finishes; the checkout is that deployed commit, so a branch carries this workflow
# before it merges. Vercel names the environments Preview and Production (read from this
# repository's deployments on 12 September 2026); production is audited on the public domain
# instead. Since 21 November 2026 the project builds no branch previews (runbook, Deploy), so
# this workflow sits idle until the owner turns them back on.
#
# Every vercel.app host but the public stand-in (runbook, Hosting today) sits behind Vercel
# Authentication, so the audit of a preview needs the project's
# Protection Bypass for Automation secret as the repository secret
# VERCEL_AUTOMATION_BYPASS_SECRET. Until the owner creates it the job fails (since 21 November
# 2026; it used to skip with a notice), so a green Lighthouse always means an audit ran. A fork's
# preview never runs here: GitHub does not start a run for a commit no branch of this repository points to. Lighthouse sends the secret on every request the
# page makes, the Sanity CDN's and PostHog's included, and the reports embed it, so nothing is
# uploaded.

name: Lighthouse

on: deployment_status

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.preset }})
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    env:
      LIGHTHOUSE_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      LIGHTHOUSE_PRESET: ${{ matrix.preset }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: The bypass secret must be set
        if: env.VERCEL_AUTOMATION_BYPASS_SECRET == ''
        shell: bash
        run: |
          echo "::error title=Lighthouse did not run::VERCEL_AUTOMATION_BYPASS_SECRET is not set, so the preview (behind Vercel Authentication) cannot be audited. Create a Protection Bypass for Automation secret in the Vercel project (Settings, Deployment Protection) and store it as this repository secret (docs/runbook.md, Lighthouse)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: lhci autorun against the preview
        run: bun run --filter @oy/web lighthouse
