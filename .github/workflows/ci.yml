# CI on every pull request and on pushes to main. Spec: docs/design/QUALITY.md section 5.
# Phase 0 wired: the check (typecheck, Biome, voice and colour lints, unit tests, toolchain
# pins), the web build with a JS size summary, the commit message rules on pull requests,
# and shellcheck on the repo scripts. Phase 1 added the Storybook build with Chromatic, split
# into two jobs on 21 November 2026 so neither reports green without running.
# Phase 2 added the TypeGen drift check. Phase 3 added Playwright with axe against the dev
# server (preview deployments sit behind Vercel Authentication, so the suite runs locally on the
# runner with the placeholder variables and intercepts the actions). Phase 4 added Lighthouse CI
# against each preview in its own workflow, lighthouse.yml (on deployment_status). Phase 9 adds
# the nightly content-lint workflow. Every job here is safe to require in branch protection: none
# is path filtered, so each reports on every pull request.
#
# The two PUBLIC_SANITY_* variables are required by the astro:env schema since Phase 2. The
# build never reads content (every page is server rendered), so placeholder values let the
# build and the typecheck run without a project; Vercel holds the real ones.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SANITY_PROJECT_ID: placeholder
      PUBLIC_SANITY_DATASET: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: bun run check
        run: bun run check

  build:
    name: Build packages/web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SANITY_PROJECT_ID: placeholder
      PUBLIC_SANITY_DATASET: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: bun run build
        run: bun run build
      - name: Client JavaScript sizes (budget is 60 KB gzipped per content page, QUALITY.md section 3)
        shell: bash
        run: |
          {
            echo '### Client JavaScript in packages/web/.vercel/output/static/_astro'
            echo
            echo '| File | Gzipped bytes |'
            echo '| --- | --- |'
            find packages/web/.vercel/output/static/_astro -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | tr -d ' ')"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  typegen:
    name: TypeGen drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Regenerate schema.json and sanity.types.ts (offline, no project needed)
        run: bun typegen
      - name: The committed files must match the schema
        run: |
          git diff --exit-code -- packages/content/schema.json packages/content/src/sanity.types.ts || {
            echo '::error title=TypeGen drift::Run `bun typegen` and commit packages/content/schema.json and packages/content/src/sanity.types.ts.'
            exit 1
          }

  messages:
    name: Commit messages and PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Conventional subjects, no em dashes (same rules as the local commit-msg hook)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: bash -n scripts/*.sh scripts/tests/*.sh .claude/hooks/*.sh
      # SC2034 is excluded because the wizard library defines colour variables it leaves to
      # the stages; the library is copied verbatim from the wizard skill template.
      - name: shellcheck (preinstalled on the runner image)
        run: shellcheck --severity=warning --exclude=SC2034 scripts/*.sh scripts/tests/*.sh .claude/hooks/*.sh
      - name: Node for the script tests (the dataset guard is a Node script)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Script tests
        run: for test in scripts/tests/*.test.sh; do bash "$test"; done

  regrowth:
    name: Regrowth ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check compares the change with its merge base, so it needs the base's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: No purged comment or report markdown grows back (scripts/check-regrowth.mjs)
        if: github.event_name == 'pull_request'
        env:
          REGROWTH_BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-regrowth.mjs

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Build the Storybook (packages/ui/storybook-static)
        run: bun run --filter @oy/ui build-storybook
      - name: Hand the build to the Chromatic job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 3

  # Its own job, so a green "Storybook build" never stands for a Chromatic run that did not
  # happen. With no token it fails: stage 6 of scripts/setup-wizard.sh stores
  # CHROMATIC_PROJECT_TOKEN as a repository secret. Pull requests from forks and from Dependabot
  # never see repository secrets, so this check is red on them; afo merges those by hand.
  chromatic:
    name: Chromatic
    needs: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: The token must be set
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        shell: bash
        run: |
          echo "::error title=Chromatic did not run::CHROMATIC_PROJECT_TOKEN is not set. Run stage 6 of scripts/setup-wizard.sh to add the secret, or drop Chromatic from .agents/merge-policy.json requiredChecks."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic reads the git history to find the baseline build for this branch.
          fetch-depth: 0
          persist-credentials: false
      - name: The Storybook the build job made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static
          path: packages/ui/storybook-static
      - name: Publish to Chromatic (snapshots at 375 and 1440 from parameters.chromatic.modes)
        uses: chromaui/action@f305ef908327aee3b80b0e6b3bbb60a742eaa049 # v18.13.6
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          storybookBuildDir: storybook-static
          # Visual changes are the owner's to accept in Chromatic; they do not fail CI.
          exitZeroOnChanges: true
          exitOnceUploaded: true

  e2e:
    name: Playwright and axe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SANITY_PROJECT_ID: placeholder
      PUBLIC_SANITY_DATASET: development
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Chromium with its system dependencies (Playwright recommends no cache)
        # From packages/web, where the pinned Playwright is linked (docs/runbook.md, Playwright and axe).
        working-directory: packages/web
        run: bunx playwright install --with-deps chromium
      - name: bun e2e (starts astro dev on 4322, docs/research/phase-3-playwright-and-axe.md)
        run: bun e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 14
