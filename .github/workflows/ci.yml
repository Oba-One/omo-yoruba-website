# CI on every pull request and on pushes to main. Spec: docs/design/QUALITY.md section 5.
# Phase 0 wired: the check (typecheck, Biome, voice and colour lints, unit tests, toolchain
# pins), the web build with a JS size summary, the commit message rules on pull requests,
# and shellcheck on the repo scripts. Phase 1 added the Storybook build with Chromatic.
# Phase 2 added the TypeGen drift check. Later phases add, in order: Playwright with axe
# against the Vercel preview (Phase 3), Lighthouse CI against the preview (Phase 4), and the
# nightly content-lint workflow (Phase 9). Every job here is safe to require in branch
# protection: none is path filtered, so each reports on every pull request.
#
# The two PUBLIC_SANITY_* variables are required by the astro:env schema since Phase 2. The
# build never reads content (every page is server rendered), so placeholder values let the
# build and the typecheck run without a project; Vercel holds the real ones.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SANITY_PROJECT_ID: placeholder
      PUBLIC_SANITY_DATASET: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: bun run check
        run: bun run check

  build:
    name: Build packages/web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SANITY_PROJECT_ID: placeholder
      PUBLIC_SANITY_DATASET: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: bun run build
        run: bun run build
      - name: Client JavaScript sizes (budget is 60 KB gzipped per content page, QUALITY.md section 3)
        shell: bash
        run: |
          {
            echo '### Client JavaScript in packages/web/.vercel/output/static/_astro'
            echo
            echo '| File | Gzipped bytes |'
            echo '| --- | --- |'
            find packages/web/.vercel/output/static/_astro -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | tr -d ' ')"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  typegen:
    name: TypeGen drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Regenerate schema.json and sanity.types.ts (offline, no project needed)
        run: bun typegen
      - name: The committed files must match the schema
        run: |
          git diff --exit-code -- packages/content/schema.json packages/content/src/sanity.types.ts || {
            echo '::error title=TypeGen drift::Run `bun typegen` and commit packages/content/schema.json and packages/content/src/sanity.types.ts.'
            exit 1
          }

  messages:
    name: Commit messages and PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Conventional subjects, no em dashes (same rules as the local commit-msg hook)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commits.sh "$BASE_SHA" "$HEAD_SHA"

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: bash -n scripts/*.sh .claude/hooks/*.sh
      # SC2034 is excluded because the wizard library defines colour variables it leaves to
      # the stages; the library is copied verbatim from the wizard skill template.
      - name: shellcheck (preinstalled on the runner image)
        run: shellcheck --severity=warning --exclude=SC2034 scripts/*.sh .claude/hooks/*.sh

  storybook:
    name: Storybook build and Chromatic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Stage 6 of scripts/setup-wizard.sh stores the token as a repository secret. Secrets are
      # empty on pull requests from forks and before the wizard has run; the Chromatic steps
      # then skip with a notice instead of failing, so this job can be a required check.
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic reads the git history to find the baseline build for this branch.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Build the Storybook (packages/ui/storybook-static)
        run: bun run --filter @oy/ui build-storybook
      - name: Chromatic skipped
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        shell: bash
        run: |
          message='CHROMATIC_PROJECT_TOKEN is not set, so the Storybook was built but not published to Chromatic. Run stage 6 of scripts/setup-wizard.sh to add the secret (pull requests from forks never see it).'
          echo "::notice title=Chromatic skipped::$message"
          {
            echo '### Chromatic skipped'
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to Chromatic (snapshots at 375 and 1440 from parameters.chromatic.modes)
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # v18.7.2
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          storybookBuildDir: storybook-static
          # Visual changes are the owner's to accept in Chromatic; they do not fail CI.
          exitZeroOnChanges: true
          exitOnceUploaded: true
