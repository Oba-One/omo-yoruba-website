# Bun and the lockfile are the source of truth for application dependencies, so npm package
# update PRs stay off (the weekly audit workflow surfaces vulnerabilities instead). GitHub
# Actions updates stay on, monthly and grouped, so the pinned action SHAs do not go stale.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
